name: Build and publish Taikeron Launcher

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'installer/**'
      - '.github/workflows/build-windows.yml'
      - '.github/release/launcher-release.json'
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: taikeron-launcher-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Read launcher version
        id: version
        shell: powershell
        run: |
          [xml]$project = Get-Content 'src/Taikeron.Launcher/Taikeron.Launcher.csproj'
          $version = [string]$project.Project.PropertyGroup.Version
          if ([string]::IsNullOrWhiteSpace($version)) { throw 'Version Launcher absente du csproj' }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=launcher-v$version" >> $env:GITHUB_OUTPUT

      - name: Restore launcher
        run: dotnet restore src/Taikeron.Launcher/Taikeron.Launcher.csproj -r win-x64

      - name: Restore update worker
        run: dotnet restore src/Taikeron.UpdateWorker/Taikeron.UpdateWorker.csproj -r win-x64

      - name: Restore Launcher updater
        run: dotnet restore src/Taikeron.LauncherUpdater/Taikeron.LauncherUpdater.csproj -r win-x64

      - name: Verify destructive-cleanup safety contract
        shell: powershell
        run: |
          $worker = Get-Content 'src/Taikeron.UpdateWorker/ProgramV2.cs' -Raw
          $shared = Get-Content 'src/Taikeron.Shared/TlRuntimeCleanup.cs' -Raw
          $ui = Get-Content 'src/Taikeron.Launcher/MainWindow.xaml' -Raw
          $iss = Get-Content 'installer/TaikeronLauncher.iss' -Raw

          if ($worker -notmatch 'TlRuntimeCleanup\.PurgeVolatileState') { throw 'Le worker TL ne purge plus le runtime Electron/Chromium.' }
          if ($worker -notmatch 'Path\.Combine\(installDirectory, "Taikeron\.exe"\)') { throw 'Le worker TL ne vérifie plus Taikeron.exe après installation.' }
          if ($worker -notmatch '"Taikeron Lab\.exe"') { throw 'La compatibilité de migration avec l’ancien exécutable TL a disparu.' }
          foreach ($root in @('dataRoot','vaultRoot','mapsRoot','backupRoot')) {
            if ($worker -notmatch [regex]::Escape($root)) { throw "Racine protégée absente du worker : $root" }
          }
          if ($shared -notmatch 'Taikeron.+Runtime.+Lab') { throw 'Profil Electron dédié absent du contrat de nettoyage.' }
          if ($ui -notmatch 'UninstallButton') { throw 'Bouton Désinstaller TL absent du Launcher.' }
          if ($iss -notmatch 'Taikeron.+Runtime.+Lab') { throw 'Désinstalleur Windows sans purge runtime TL.' }
          if ($iss -match 'filesandordirs; Name: "\{localappdata\}\\Taikeron"\s*$') { throw 'Suppression globale du dossier Taikeron interdite.' }

          Write-Host 'Contrat cleanup 0.4.7 vérifié : runtime destructible, Data/Vault/Maps/Backup protégés, Taikeron.exe canonique.'

      - name: Build launcher
        run: dotnet build src/Taikeron.Launcher/Taikeron.Launcher.csproj -c Release -r win-x64 --no-restore

      - name: Build update worker
        run: dotnet build src/Taikeron.UpdateWorker/Taikeron.UpdateWorker.csproj -c Release -r win-x64 --no-restore

      - name: Build Launcher updater
        run: dotnet build src/Taikeron.LauncherUpdater/Taikeron.LauncherUpdater.csproj -c Release -r win-x64 --no-restore

      - name: Publish launcher self-contained
        run: dotnet publish src/Taikeron.Launcher/Taikeron.Launcher.csproj -c Release -r win-x64 --self-contained true --no-restore -o artifacts/TaikeronLauncher

      - name: Publish update worker beside launcher
        run: dotnet publish src/Taikeron.UpdateWorker/Taikeron.UpdateWorker.csproj -c Release -r win-x64 --self-contained true --no-restore -o artifacts/TaikeronLauncher

      - name: Publish standalone Launcher updater
        run: dotnet publish src/Taikeron.LauncherUpdater/Taikeron.LauncherUpdater.csproj -c Release -r win-x64 --self-contained true --no-restore -o artifacts/LauncherUpdater

      - name: Add managed-root marker and Launcher updater
        shell: powershell
        run: |
          Copy-Item -LiteralPath 'artifacts/LauncherUpdater/TaikeronLauncherUpdater.exe' -Destination 'artifacts/TaikeronLauncher/TaikeronLauncherUpdater.exe' -Force
          'Taikeron Launcher managed root' | Set-Content -Encoding ascii 'artifacts/TaikeronLauncher/.taikeron-launcher-root'

      - name: Verify package
        shell: powershell
        run: |
          $required = @(
            'artifacts/TaikeronLauncher/TaikeronLauncher.exe',
            'artifacts/TaikeronLauncher/TaikeronUpdateWorker.exe',
            'artifacts/TaikeronLauncher/TaikeronLauncherUpdater.exe',
            'artifacts/TaikeronLauncher/.taikeron-launcher-root'
          )
          foreach ($file in $required) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) {
              throw "Fichier Launcher absent du package : $file"
            }
          }

      - name: Create self-update package
        shell: powershell
        run: |
          $zip = 'artifacts/Taikeron-Launcher-win-x64.zip'
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path 'artifacts/TaikeronLauncher/*' -DestinationPath $zip -CompressionLevel Optimal
          $sha = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$sha  Taikeron-Launcher-win-x64.zip" | Set-Content -Encoding ascii 'artifacts/Taikeron-Launcher-win-x64.sha256.txt'
          Write-Host "Launcher self-update SHA-256: $sha"

      - name: Install Inno Setup
        shell: powershell
        run: |
          $iscc = Get-Command ISCC.exe -ErrorAction SilentlyContinue
          if (-not $iscc) {
            choco install innosetup --no-progress -y
          }
          $candidate = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $candidate -PathType Leaf)) {
            $cmd = Get-Command ISCC.exe -ErrorAction SilentlyContinue
            if (-not $cmd) { throw 'Inno Setup ISCC.exe introuvable' }
            $candidate = $cmd.Source
          }
          "INNO_ISCC=$candidate" >> $env:GITHUB_ENV

      - name: Build Windows installer
        shell: powershell
        run: |
          $buildRoot = (Resolve-Path 'artifacts/TaikeronLauncher').Path
          $outputDir = (Resolve-Path 'artifacts').Path
          & "$env:INNO_ISCC" "/DMyAppVersion=${{ steps.version.outputs.version }}" "/DBuildRoot=$buildRoot" "/DOutputDir=$outputDir" "installer/TaikeronLauncher.iss"
          if ($LASTEXITCODE -ne 0) { throw 'Build installateur Launcher échoué' }

          $setup = 'artifacts/Taikeron-Launcher-Setup-x64.exe'
          if (-not (Test-Path -LiteralPath $setup -PathType Leaf)) {
            throw 'Installateur Taikeron Launcher absent'
          }
          $setupSha = (Get-FileHash -LiteralPath $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          "$setupSha  Taikeron-Launcher-Setup-x64.exe" | Set-Content -Encoding ascii 'artifacts/Taikeron-Launcher-Setup-x64.sha256.txt'
          Write-Host "Launcher installer SHA-256: $setupSha"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Taikeron-Launcher-win-x64
          path: |
            artifacts/Taikeron-Launcher-win-x64.zip
            artifacts/Taikeron-Launcher-win-x64.sha256.txt
            artifacts/Taikeron-Launcher-Setup-x64.exe
            artifacts/Taikeron-Launcher-Setup-x64.sha256.txt
          if-no-files-found: error

      - name: Publish GitHub release
        if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'Release Launcher ')
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $repo = $env:GITHUB_REPOSITORY
          $tag = $env:RELEASE_TAG
          $title = "Taikeron Launcher $env:RELEASE_VERSION"
          $zip = 'artifacts/Taikeron-Launcher-win-x64.zip'
          $sha = 'artifacts/Taikeron-Launcher-win-x64.sha256.txt'
          $setup = 'artifacts/Taikeron-Launcher-Setup-x64.exe'
          $setupSha = 'artifacts/Taikeron-Launcher-Setup-x64.sha256.txt'

          cmd /c "gh release view $tag --repo $repo >nul 2>nul"
          $releaseExists = ($LASTEXITCODE -eq 0)

          if ($releaseExists) {
            gh release upload $tag $zip $sha $setup $setupSha --repo $repo --clobber
          } else {
            gh release create $tag $zip $sha $setup $setupSha --repo $repo --title $title --notes "Taikeron Launcher $env:RELEASE_VERSION · Windows x64" --latest
          }

          if ($LASTEXITCODE -ne 0) { throw 'Publication de la release Launcher échouée' }
